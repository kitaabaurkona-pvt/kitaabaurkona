<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Find your next favourite at Kitaab Aur Kona. Big stories. Small prices. Your little corner." />
    <link rel="icon" type="image/png" sizes="32x32" href="/logo-32.png" />
    <link rel="apple-touch-icon" href="/logo-180.png" />
    <title>Kitaab Aur Kona</title>
    <script>
      // Apply a saved theme before the first paint.
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem('kitaab_corner_prefs') || '{}');
          var dark = p.theme === 'dark' || (p.theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          if (p.motion === 'reduce') document.documentElement.dataset.motion = 'reduce';
        } catch { /* Keep the light default when preferences cannot be read. */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
